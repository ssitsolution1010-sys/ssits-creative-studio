name: Module 13 Preset Regression
on:
  push:
    branches:
      - development/module13-batch28-selective-restore
  pull_request:
    paths:
      - 'ar-vr-interactive.html'
      - 'tests/test_module13_presets.py'
      - '.github/workflows/module13-regression.yml'
  workflow_dispatch:
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Run Module 13 regression
        run: python -m unittest discover -s tests -p 'test_module13_presets.py' -v
